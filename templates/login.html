{% extends 'base.html' %}
{% block title %}Giriş Yap - Wealth Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4">
            <h3 class="fw-bold mb-4 text-center">Giriş Yap</h3>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label">Kullanıcı Adı veya E-posta</label>
                    <input type="text" name="login_identifier" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100 py-2">Giriş Yap</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('auto_login') }}" class="btn btn-outline-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-lightning-charge me-1"></i>Tek Tıkla Hızlı Test Girişi
                </a>
            </div>
            <p class="text-center mt-3 mb-0 text-muted">
                Hesabın yok mu? <a href="{{ url_for('register') }}">Kayıt Ol</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
