{% extends 'base.html' %}
{% block title %}Giriş Yap - Moneta{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card p-4 shadow-sm border">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                    <i class="bi bi-wallet2 fs-2" aria-hidden="true"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Moneta</h1>
                <p class="text-muted small mb-0">Hesabınıza Giriş Yapın</p>
            </div>
            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label" for="loginIdentifier">Kullanıcı Adı veya E-posta</label>
                    <input type="text" name="login_identifier" id="loginIdentifier" class="form-control" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="loginPassword">Şifre</label>
                    <input type="password" name="password" id="loginPassword" class="form-control" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-cta-primary w-100 py-2 fw-semibold">Giriş Yap</button>
            </form>
            <div class="mt-3">
                <a href="{{ url_for('auto_login') }}" class="btn btn-saas-secondary w-100 py-2 fw-semibold">
                    <i class="bi bi-lightning-charge me-1 text-warning" aria-hidden="true"></i>Tek Tıkla Hızlı Test Girişi
                </a>
            </div>
            <p class="text-center mt-3 mb-0 text-muted small">
                Hesabın yok mu? <a href="{{ url_for('register') }}" class="fw-semibold text-primary">Kayıt Ol</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
