{% extends 'base.html' %}
{% block title %}Kayıt Ol - Moneta{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card p-4 shadow-sm border">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-2">
                    <i class="bi bi-wallet2 fs-2" aria-hidden="true"></i>
                </div>
                <h1 class="h3 fw-bold mb-1">Moneta</h1>
                <p class="text-muted small mb-0">Yeni Bir Hesap Oluşturun</p>
            </div>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="regFirstName">Ad</label>
                        <input type="text" name="first_name" id="regFirstName" class="form-control" required autocomplete="given-name">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label" for="regLastName">Soyad</label>
                        <input type="text" name="last_name" id="regLastName" class="form-control" required autocomplete="family-name">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="regUsername">Kullanıcı Adı</label>
                    <input type="text" name="username" id="regUsername" class="form-control" required autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="regEmail">E-posta</label>
                    <input type="email" name="email" id="regEmail" class="form-control" required autocomplete="email">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="regPassword">Şifre</label>
                    <input type="password" name="password" id="regPassword" class="form-control" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-cta-primary w-100 py-2 fw-semibold">Kayıt Ol</button>
            </form>
            <p class="text-center mt-3 mb-0 text-muted small">
                Zaten hesabın var mı? <a href="{{ url_for('login') }}" class="fw-semibold text-primary">Giriş Yap</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
