{% extends 'base.html' %}
{% block title %}Kayıt Ol - Wealth Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="fw-bold mb-4 text-center">Hesap Oluştur</h3>
            <form action="{{ url_for('register') }}" method="POST">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Ad</label>
                        <input type="text" name="first_name" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Soyad</label>
                        <input type="text" name="last_name" class="form-control" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Kullanıcı Adı</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">E-posta</label>
                    <input type="email" name="email" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Şifre</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Kayıt Ol</button>
            </form>
            <p class="text-center mt-3 mb-0 text-muted">
                Zaten hesabın var mı? <a href="{{ url_for('login') }}">Giriş Yap</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
